<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarineBlue ご注文</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --bg:#eef3f6;
    --surface:#ffffff;
    --surface-2:#f7fafb;
    --ink:#152430;
    --ink-muted:#51636e;
    --ink-faint:#8399a4;
    --line:#d7e1e6;
    --line-strong:#c3d2d9;
    --accent:#0d4a72;
    --accent-deep:#083a5c;
    --accent-soft:#e3edf3;
    --good:#2f7d5c;
    --good-soft:#e1f0e8;
    --bad:#b3413a;
    --bad-soft:#fbe7e4;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  html,body{height:100%;}
  body{margin:0;background:var(--surface);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;}
  button{font-family:inherit;}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}
  .num{font-variant-numeric:tabular-nums;}
  input,textarea{font-family:inherit;}

  .navicon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;background:none;padding:0;}
  .btn-primary{background:var(--accent);color:#fff;border:none;border-radius:9px;font-weight:500;cursor:pointer;}
  .btn-primary:hover{background:var(--accent-deep);}
  .btn-primary:disabled{opacity:.5;cursor:default;}
  .btn-ghost{background:var(--surface);color:var(--ink-muted);border:1px solid var(--line-strong);border-radius:9px;cursor:pointer;}

  .fabric-card{border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;}
  .fabric-card.selected{border-color:var(--accent);background:var(--accent-soft);}
  .radio{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);flex:none;display:flex;align-items:center;justify-content:center;}
  .fabric-card.selected .radio{background:var(--accent);border-color:var(--accent);}
  .qty-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-size:15px;color:var(--ink);cursor:pointer;line-height:1;}
  .qty-btn:hover{background:var(--surface-2);}

  .page{min-height:100vh;display:flex;flex-direction:column;}
  .screen{display:flex;flex-direction:column;flex:1;min-height:0;}
</style>
</head>
<body>

<div class="page">

  <div id="liff-loading" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;">
    <div style="width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 0.8s linear infinite;"></div>
    <div id="liff-loading-text" style="font-size:12.5px;color:var(--ink-muted);">読み込み中…</div>
    <div id="liff-debug" hidden class="mono" style="font-size:10px;color:var(--ink-faint);max-width:88%;text-align:left;white-space:pre-wrap;line-height:1.6;"></div>
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg);}}</style>

  <div id="liff-error" hidden style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;gap:10px;">
    <div style="font-size:13.5px;color:var(--bad);">読み込みに失敗しました</div>
    <div id="liff-error-detail" style="font-size:11.5px;color:var(--ink-faint);line-height:1.7;"></div>
  </div>

  <div id="order-step-1" class="screen" hidden>
    <div style="padding:18px 18px 0;">
      <div style="display:flex;align-items:center;justify-content:center;">
        <div style="font-family:'Shippori Mincho',serif;font-weight:700;font-size:15px;">ご注文</div>
      </div>
      <div style="display:flex;gap:6px;margin-top:16px;">
        <div style="flex:1;height:4px;border-radius:2px;background:var(--accent);"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--line);"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--line);"></div>
      </div>
    </div>

    <div style="flex:1;overflow-y:auto;padding:20px 18px 16px;">
      <div style="font-size:14.5px;font-weight:600;margin-bottom:3px;">商品を検索してください</div>
      <div style="font-size:12px;color:var(--ink-faint);margin-bottom:14px;">型番・商品名で検索できます</div>

      <div style="display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-bottom:16px;">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#8399a4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><circle cx="8.7" cy="8.7" r="5.7"></circle><path d="m17 17-4.3-4.3"></path></svg>
        <input id="item-search" type="text" placeholder="型番・商品名で検索（例：110001、Tシャツ）" style="border:none;background:none;outline:none;font-size:12.5px;width:100%;color:var(--ink);" onkeydown="if(event.key==='Enter'){event.preventDefault();searchItems();}">
        <button onclick="searchItems()" style="flex:none;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:7px 13px;font-size:12px;cursor:pointer;">検索</button>
      </div>

      <div id="item-list" style="display:flex;flex-direction:column;gap:9px;"></div>
      <div id="item-empty-note" style="font-size:11.5px;color:var(--ink-faint);margin-top:12px;text-align:center;">型番や商品名を入力して検索してください</div>

      <div id="color-section" hidden>
        <div style="height:1px;background:var(--line);margin:22px 0 16px;"></div>
        <div style="font-size:14.5px;font-weight:600;margin-bottom:12px;">カラーを選んでください</div>
        <div id="color-list" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
      </div>

      <div id="size-section" hidden>
        <div style="height:1px;background:var(--line);margin:22px 0 16px;"></div>
        <div style="font-size:14.5px;font-weight:600;margin-bottom:3px;">サイズ・数量</div>
        <div id="fabric-selected-name" style="font-size:12px;color:var(--ink-faint);margin-bottom:12px;"></div>
        <div id="size-rows" style="display:flex;flex-direction:column;gap:6px;"></div>
        <button class="btn-outline" style="width:100%;height:44px;font-size:13px;margin-top:14px;border:1.5px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:9px;cursor:pointer;" onclick="addToCart()">＋ カートに追加</button>
      </div>

      <div id="cart-section" hidden>
        <div style="height:1px;background:var(--line);margin:22px 0 16px;"></div>
        <div style="font-size:14.5px;font-weight:600;margin-bottom:12px;">カート内の商品</div>
        <div id="cart-list" style="display:flex;flex-direction:column;gap:8px;"></div>
      </div>
    </div>

    <div style="background:var(--surface);border-top:1px solid var(--line);padding:12px 18px 18px;display:flex;align-items:center;gap:14px;">
      <div>
        <div style="font-size:11px;color:var(--ink-faint);">カート合計</div>
        <div class="mono num" id="qty-total" style="font-size:16px;font-weight:600;">–</div>
      </div>
      <button class="btn-primary" style="flex:1;height:46px;font-size:14px;" onclick="proceedToDesign()">次へ：デザイン</button>
    </div>
  </div>

  <div id="order-step-2" class="screen" hidden>
    <div style="padding:18px 18px 0;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <button class="navicon" style="background:var(--surface-2);" onclick="goToStep(1)">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="#152430" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"></path></svg>
        </button>
        <div style="font-family:'Shippori Mincho',serif;font-weight:700;font-size:15px;">ご注文</div>
        <div style="width:34px;"></div>
      </div>
      <div style="display:flex;gap:6px;margin-top:16px;">
        <div style="flex:1;height:4px;border-radius:2px;background:var(--accent);"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--accent);"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--line);"></div>
      </div>
    </div>

    <div style="flex:1;overflow-y:auto;padding:22px 18px 16px;">
      <div style="font-size:14.5px;font-weight:600;margin-bottom:3px;">デザインについて教えてください</div>
      <div style="font-size:12px;color:var(--ink-faint);margin-bottom:16px;">画像がなくてもご要望だけで結構です</div>

      <input id="design-file-input" type="file" accept="image/*" style="display:none;" onchange="onDesignFileChange(event)">
      <div id="upload-box" onclick="document.getElementById('design-file-input').click()" style="border:1.5px dashed var(--line-strong);border-radius:14px;padding:22px;text-align:center;cursor:pointer;">
        <img id="upload-preview" hidden style="max-width:100%;max-height:160px;border-radius:8px;margin-bottom:10px;">
        <div id="upload-icon" style="width:40px;height:40px;border-radius:10px;background:var(--accent-soft);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;">
          <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="#0d4a72" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13V4M6 8l4-4 4 4"></path><path d="M4 14v1.5A1.5 1.5 0 0 0 5.5 17h9a1.5 1.5 0 0 0 1.5-1.5V14"></path></svg>
        </div>
        <div id="upload-text" style="font-size:13px;color:var(--ink-muted);">タップして画像をアップロード</div>
      </div>

      <div style="font-size:13px;font-weight:600;margin:20px 0 8px;">ご要望・メモ</div>
      <textarea id="design-text" rows="4" placeholder="例：胸に小さくロゴ、背中に大きくチーム名を入れたい" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13px;resize:none;outline:none;"></textarea>
    </div>

    <div style="background:var(--surface);border-top:1px solid var(--line);padding:12px 18px 18px;">
      <button class="btn-primary" style="width:100%;height:46px;font-size:14px;" onclick="goToStep(3)">次へ：ご連絡先</button>
    </div>
  </div>

  <div id="order-step-3" class="screen" hidden>
    <div style="padding:18px 18px 0;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <button class="navicon" style="background:var(--surface-2);" onclick="goToStep(2)">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="#152430" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.5 10l6 6"></path></svg>
        </button>
        <div style="font-family:'Shippori Mincho',serif;font-weight:700;font-size:15px;">ご注文</div>
        <div style="width:34px;"></div>
      </div>
      <div style="display:flex;gap:6px;margin-top:16px;">
        <div style="flex:1;height:4px;border-radius:2px;background:var(--accent);"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--accent);"></div>
        <div style="flex:1;height:4px;border-radius:2px;background:var(--accent);"></div>
      </div>
    </div>

    <div style="flex:1;overflow-y:auto;padding:22px 18px 16px;">
      <div style="display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:20px;">
        <img id="liff-avatar" style="width:40px;height:40px;border-radius:50%;flex:none;background:var(--line);">
        <div>
          <div style="font-size:11px;color:var(--ink-faint);">LINEアカウント</div>
          <div id="liff-name" style="font-size:13.5px;font-weight:600;"></div>
        </div>
      </div>

      <div style="font-size:12.5px;color:var(--ink-muted);margin-bottom:6px;">電話番号<span style="color:var(--bad);">※必須</span></div>
      <input id="cust-contact" type="tel" required placeholder="例：090-1234-5678" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13.5px;outline:none;margin-bottom:16px;">

      <div style="font-size:12.5px;color:var(--ink-muted);margin-bottom:6px;">納品希望日（任意）</div>
      <input id="cust-date" type="date" style="width:100%;box-sizing:border-box;display:block;-webkit-appearance:none;appearance:none;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13.5px;outline:none;color:var(--ink);">

      <div style="background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-top:22px;">
        <div style="font-size:12.5px;font-weight:600;margin-bottom:8px;">ご注文内容</div>
        <div id="order-summary" style="font-size:12.5px;color:var(--ink-muted);line-height:1.9;"></div>
      </div>
    </div>

    <div style="background:var(--surface);border-top:1px solid var(--line);padding:12px 18px 18px;">
      <button id="submit-btn" class="btn-primary" style="width:100%;height:46px;font-size:14px;" onclick="submitOrder()">この内容で注文する</button>
    </div>
  </div>

  <div id="order-complete" class="screen" hidden style="align-items:center;justify-content:center;padding:32px;text-align:center;">
    <div style="width:56px;height:56px;border-radius:50%;background:var(--good-soft);display:flex;align-items:center;justify-content:center;margin-bottom:18px;">
      <svg width="26" height="26" viewBox="0 0 20 20" fill="none" stroke="#2f7d5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 10 4 4 8-9"></path></svg>
    </div>
    <div style="font-family:'Shippori Mincho',serif;font-weight:700;font-size:17px;margin-bottom:8px;">ご注文ありがとうございます</div>
    <div style="font-size:12.5px;color:var(--ink-muted);line-height:1.8;">LINEに確認メッセージをお送りしました。見積り・デザインについては、このトークルームで担当者からご連絡します。</div>
    <div class="mono" id="complete-order-id" style="margin-top:16px;font-size:12px;color:var(--ink-faint);"></div>
    <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:260px;margin-top:24px;">
      <button class="btn-primary" style="width:100%;height:44px;font-size:13px;" onclick="closeLiff()">トークに戻る</button>
    </div>
  </div>

</div>

<script>
/* このページはNetlifyで静的ホストし、データの保存・LINE通知はすべてGAS(customerプロジェクト)のdoPost APIを叩いて行う。
   GAS単体でLIFF SDKをホストするとliff.init()が完了しない既知の相性問題があるため、フォームの表示だけここに切り出した。 */
const CUSTOMER_API_URL = 'https://script.google.com/macros/s/AKfycbw7KCi8g5YQGN2hwauyF4b3j8FwtwtoEZ1dZb4p5ABHkmRNIU6YpkgZqoJ7mkuVrAi_cQ/exec';

function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function gsError(err){
  console.error(err);
  alert('サーバーとの通信でエラーが発生しました。時間をおいて再度お試しください。\n' + (err && err.message ? err.message : err));
}
function sizeLines(sizes, opts){
  opts = opts || {};
  const rows = Object.keys(sizes).filter(s=>sizes[s]>0).map(s=>
    `<div style="display:flex;justify-content:space-between;align-items:center;padding:${opts.pad||'4px 0'};${opts.divider?'border-bottom:1px solid var(--line);':''}">
      <span style="font-size:${opts.size||'13px'};">${esc(s)}</span>
      <span class="mono" style="font-size:${opts.size||'13px'};color:${opts.muted?'var(--ink-muted)':'var(--ink)'};">${sizes[s]}枚</span>
    </div>`
  ).join('');
  return rows || `<div style="font-size:${opts.size||'13px'};color:var(--ink-faint);">サイズ未選択</div>`;
}

let orderForm = { itemCode:null, itemName:'', price:null, colorCode:null, colorName:'', sizes:{}, designImage:null, step:1 };
let cart = [];
let lineProfile = null;
let itemSearchResults = [];
let colorOptions = [];
let productStock = [];

/* 商品コード・商品名・価格だけの一覧を起動時に1回だけ取得し、以降の検索は端末内でフィルタする。
   カタログが増えて数千点規模になっても、検索のたびにサーバーへ問い合わせない。 */
let productIndex = [];
let productIndexLoaded = false;
function loadProductIndex(){
  fetch(CUSTOMER_API_URL + '?mode=itemIndex')
    .then(function(res){ return res.json(); })
    .then(function(data){
      productIndex = (data || []).map(function(it){ return { itemCode:String(it.itemCode), itemName:String(it.itemName||''), price: it.price, modelNo:String(it.modelNo||''), sizeName:String(it.sizeName||'') }; });
      productIndexLoaded = true;
      if(document.getElementById('item-search').value.trim()) searchItems();
    })
    .catch(function(err){ console.error('商品データの取得に失敗: ', err); });
}
loadProductIndex();

const ORDER_SCREEN_IDS = {step1:'order-step-1',step2:'order-step-2',step3:'order-step-3',complete:'order-complete'};
function showOrderScreen(name){
  Object.entries(ORDER_SCREEN_IDS).forEach(([k,id])=>{ document.getElementById(id).hidden = k!==name; });
  window.scrollTo(0,0);
}
function goToStep(n){
  orderForm.step = n;
  showOrderScreen('step'+n);
  if(n===3) renderSummary();
}
function currentSelectionTotal(){
  return Object.values(orderForm.sizes).reduce((a,b)=>a+b,0);
}
function addToCart(){
  if(!orderForm.itemCode || !orderForm.colorCode){ alert('商品とカラーを選択してください。'); return; }
  if(currentSelectionTotal()<=0){ alert('サイズを選択し、数量を1枚以上入力してください。'); return; }
  cart.push({
    itemCode: orderForm.itemCode, itemName: orderForm.itemName,
    colorCode: orderForm.colorCode, colorName: orderForm.colorName,
    sizes: Object.assign({}, orderForm.sizes)
  });
  resetItemSelection_();
  document.getElementById('item-search').value = '';
  document.getElementById('item-list').innerHTML = '';
  const note = document.getElementById('item-empty-note');
  note.textContent = '型番や商品名を入力して検索してください';
  note.style.display = 'block';
  renderCart();
}
function removeFromCart(idx){
  cart.splice(idx,1);
  renderCart();
}
function cartTotalQty(){
  return cart.reduce(function(sum,item){ return sum + Object.values(item.sizes).reduce((a,b)=>a+b,0); },0);
}
function renderCart(){
  document.getElementById('cart-section').hidden = cart.length===0;
  document.getElementById('cart-list').innerHTML = cart.map(function(item,idx){
    const total = Object.values(item.sizes).reduce((a,b)=>a+b,0);
    return `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;">
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:600;">${esc(item.itemCode)} ${esc(item.itemName)}${item.colorName?' ／ '+esc(item.colorName):''}</div>
        <div style="margin-top:4px;">${sizeLines(item.sizes,{size:'11.5px',muted:true,pad:'1px 0'})}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex:none;">
        <span class="mono num" style="font-size:12.5px;">計${total}枚</span>
        <button onclick="removeFromCart(${idx})" style="border:none;background:none;color:var(--bad);font-size:11.5px;cursor:pointer;">削除</button>
      </div>
    </div>`;
  }).join('');
  updateTotal();
}
function proceedToDesign(){
  if(orderForm.itemCode && orderForm.colorCode && currentSelectionTotal()>0){
    addToCart();
  }
  if(cart.length===0){ alert('商品を選択して、カートに追加してください。'); return; }
  goToStep(2);
}

function resetItemSelection_(){
  orderForm.itemCode=null;
  orderForm.itemName='';
  orderForm.colorCode=null;
  orderForm.colorName='';
  orderForm.sizes={};
  colorOptions=[];
  productStock=[];
  document.getElementById('color-section').hidden=true;
  document.getElementById('size-section').hidden=true;
  updateTotal();
}
function searchItems(){
  const qRaw = document.getElementById('item-search').value.trim();
  const q = qRaw.toLowerCase();
  const note = document.getElementById('item-empty-note');
  /* 検索するたびに、前回選択していたカラー・サイズを引きずらないようにリセットする */
  resetItemSelection_();
  if(!qRaw){
    itemSearchResults=[];
    document.getElementById('item-list').innerHTML='';
    note.textContent='型番や商品名を入力して検索してください';
    note.style.display='block';
    return;
  }
  if(!productIndexLoaded){
    document.getElementById('item-list').innerHTML='';
    note.textContent='商品データを読み込み中です…';
    note.style.display='block';
    return;
  }
  const qDigits = q.replace(/\D/g,'');
  itemSearchResults = productIndex.filter(function(it){
    const modelNo = it.modelNo.toLowerCase();
    return it.itemCode.toLowerCase().indexOf(q)>=0 || it.itemName.toLowerCase().indexOf(q)>=0 || modelNo.indexOf(q)>=0
      || (qDigits && modelNo.replace(/\D/g,'').indexOf(qDigits)>=0);
  }).slice(0,50);
  renderItemList();
  note.style.display = itemSearchResults.length ? 'none' : 'block';
  note.textContent = '一致する商品が見つかりませんでした';
}
function renderItemList(){
  document.getElementById('item-list').innerHTML = itemSearchResults.map(f=>`
    <div class="fabric-card ${f.itemCode===orderForm.itemCode?'selected':''}" onclick="selectItem('${f.itemCode}')">
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:6px;"><span class="mono" style="font-size:11px;color:${f.itemCode===orderForm.itemCode?'var(--accent)':'var(--ink-faint)'};">${esc(f.itemCode)}</span><span style="font-size:13.5px;font-weight:600;">${esc(f.itemName)}${f.sizeName?'（'+esc(f.sizeName)+'）':''}</span></div>
      </div>
      <div class="radio">${f.itemCode===orderForm.itemCode?'<svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 10 4 4 8-9"></path></svg>':''}</div>
    </div>`).join('');
}
function selectItem(code){
  const item = itemSearchResults.find(x=>x.itemCode===code);
  if(!item) return;
  orderForm.itemCode = code;
  orderForm.itemName = item.itemName;
  orderForm.price = item.price;
  orderForm.colorCode = null;
  orderForm.colorName = '';
  orderForm.sizes = {};
  renderItemList();
  document.getElementById('size-section').hidden = true;
  fetch(CUSTOMER_API_URL + '?mode=productColors&code=' + encodeURIComponent(code))
    .then(function(res){ return res.json(); })
    .then(function(colors){
      colorOptions = colors || [];
      renderColorList();
      document.getElementById('color-section').hidden = false;
      if(colorOptions.length===1){ selectColor(colorOptions[0].colorCode); }
    })
    .catch(function(err){ console.error('カラー取得に失敗: ', err); });
}
function renderColorList(){
  document.getElementById('color-list').innerHTML = colorOptions.map(c=>`
    <button onclick="selectColor('${c.colorCode}')" style="padding:9px 14px;border-radius:999px;font-size:12.5px;cursor:pointer;border:1.5px solid ${c.colorCode===orderForm.colorCode?'var(--accent)':'var(--line-strong)'};background:${c.colorCode===orderForm.colorCode?'var(--accent-soft)':'var(--surface)'};color:${c.colorCode===orderForm.colorCode?'var(--accent)':'var(--ink)'};">${esc(c.colorName)}</button>`).join('');
}
function selectColor(colorCode){
  const c = colorOptions.find(x=>x.colorCode===colorCode);
  orderForm.colorCode = colorCode;
  orderForm.colorName = c ? c.colorName : '';
  orderForm.sizes = {};
  renderColorList();
  fetch(CUSTOMER_API_URL + '?mode=productStock&code=' + encodeURIComponent(orderForm.itemCode) + '&color=' + encodeURIComponent(colorCode))
    .then(function(res){ return res.json(); })
    .then(function(stock){
      productStock = stock || [];
      orderForm.sizes = {};
      productStock.forEach(function(row){ orderForm.sizes[row.size] = 0; });
      document.getElementById('size-section').hidden = false;
      renderSizeRows();
    })
    .catch(function(err){ console.error('在庫取得に失敗: ', err); });
}
function renderSizeRows(){
  document.getElementById('fabric-selected-name').textContent = orderForm.itemCode+' '+orderForm.itemName+' ／ '+orderForm.colorName;
  document.getElementById('size-rows').innerHTML = productStock.map(row=>{
    const sz = row.size;
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 4px;border-bottom:1px solid var(--line);">
      <div>
        <span style="font-size:13.5px;">${esc(sz)}</span>
        <div style="font-size:10.5px;margin-top:2px;">${stockLabel(row)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        <button class="qty-btn" onclick="changeQty('${sz}',-1)">−</button>
        <span class="mono num" style="font-size:14px;min-width:14px;text-align:center;">${orderForm.sizes[sz]||0}</span>
        <button class="qty-btn" onclick="changeQty('${sz}',1)">＋</button>
      </div>
    </div>`;
  }).join('') || '<div style="font-size:12px;color:var(--ink-faint);">この商品のサイズ情報が見つかりませんでした</div>';
  updateTotal();
}
function stockLabel(row){
  if(row.qty<=0) return '<span style="color:var(--bad);">在庫切れ・お取り寄せ</span>';
  if(row.qty<5) return `<span style="color:var(--thread);">在庫少なめ（残り${row.qty}枚）</span>`;
  return `<span style="color:var(--ink-faint);">在庫あり（${row.qty}枚）</span>`;
}
function changeQty(sz, delta){
  orderForm.sizes[sz] = Math.max(0, orderForm.sizes[sz]+delta);
  renderSizeRows();
}
function updateTotal(){
  const total = cartTotalQty();
  document.getElementById('qty-total').innerHTML = total+`<span style="font-size:12px;color:var(--ink-faint);font-family:'Zen Kaku Gothic New',sans-serif;">枚</span>`;
}

const MAX_DESIGN_FILE_MB = 8;
function onDesignFileChange(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ alert('画像ファイルを選択してください。'); e.target.value=''; return; }
  if(file.size > MAX_DESIGN_FILE_MB*1024*1024){ alert('画像サイズが大きすぎます（'+MAX_DESIGN_FILE_MB+'MB以下にしてください）。'); e.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = function(){
    const dataUrl = reader.result;
    orderForm.designImage = { base64: dataUrl.split(',')[1], mime: file.type, name: file.name };
    const preview = document.getElementById('upload-preview');
    preview.src = dataUrl;
    preview.hidden = false;
    document.getElementById('upload-icon').hidden = true;
    document.getElementById('upload-text').textContent = file.name + ' を添付しました（タップで変更）';
  };
  reader.onerror = function(){ alert('画像の読み込みに失敗しました。'); };
  reader.readAsDataURL(file);
}

function renderSummary(){
  const total = cartTotalQty();
  const dateVal = document.getElementById('cust-date').value;
  const itemBlocks = cart.map(function(item){
    return `<div style="margin-bottom:8px;">
      <div style="font-size:12.5px;color:var(--ink-muted);margin-bottom:2px;">${esc(item.itemCode)} ${esc(item.itemName)} ／ ${esc(item.colorName)}</div>
      ${sizeLines(item.sizes,{divider:true,size:'12.5px',muted:true})}
    </div>`;
  }).join('');
  document.getElementById('order-summary').innerHTML = `
    ${itemBlocks}
    <div style="display:flex;justify-content:space-between;padding:7px 0 2px;">
      <span style="font-size:12.5px;font-weight:600;">合計</span>
      <span class="mono" style="font-size:12.5px;font-weight:600;">${total}枚</span>
    </div>
    <div style="height:1px;background:var(--line);margin:10px 0;"></div>
    <div style="font-size:12.5px;color:var(--ink-muted);">デザイン：${orderForm.designImage?'画像あり':'画像なし'}${document.getElementById('design-text').value.trim()?'・メモあり':''}</div>
    <div style="font-size:12.5px;color:var(--ink-muted);margin-top:4px;">納品希望日：${dateVal || '未指定'}</div>`;
}

/* 端末の電話番号オートフィルが、日本の携帯番号の先頭の0を省いて補完することがあるため、
   09012345678のような0始まり10桁の携帯番号に見える場合は先頭に0を補って送信する */
function normalizePhone_(raw){
  const digits = raw.replace(/[^\d]/g,'');
  if(/^[1-9]\d{9}$/.test(digits)) return '0'+digits;
  return raw;
}
function submitOrder(){
  if(!lineProfile){ alert('LINEのプロフィール取得に失敗しています。アプリを開き直してください。'); return; }
  const contact = normalizePhone_(document.getElementById('cust-contact').value.trim());
  if(!contact){ alert('電話番号を入力してください。'); document.getElementById('cust-contact').focus(); return; }
  const desiredDate = document.getElementById('cust-date').value;
  const designNote = document.getElementById('design-text').value.trim();
  const payload = {
    lineUserId: lineProfile.userId,
    lineDisplayName: lineProfile.displayName,
    contact: contact,
    items: cart,
    desiredDate: desiredDate,
    designNote: designNote,
    designImageBase64: orderForm.designImage ? orderForm.designImage.base64 : '',
    designImageName: orderForm.designImage ? orderForm.designImage.name : '',
    designImageMime: orderForm.designImage ? orderForm.designImage.mime : ''
  };

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '送信中…';

  fetch(CUSTOMER_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ apiAction: 'createOrdersFromLiffCart', payload: payload })
  })
    .then(function(res){ return res.json(); })
    .then(function(result){
      btn.disabled = false;
      btn.textContent = 'この内容で注文する';
      if(!result.ok){ gsError(result.error || '注文の登録に失敗しました'); return; }
      cart = [];
      showOrderScreen('complete');
      document.getElementById('complete-order-id').textContent = '注文番号：#'+(result.result.orderId||'');
    })
    .catch(function(err){
      btn.disabled = false;
      btn.textContent = 'この内容で注文する';
      gsError(err);
    });
}

function closeLiff(){
  try{ if(liff.isInClient()) { liff.closeWindow(); return; } }catch(e){}
  window.close();
}

/* ============ LIFF初期化 ============ */
const liffSteps = [];
function step(s){
  liffSteps.push(s);
  const dbg = document.getElementById('liff-debug');
  if(dbg) dbg.textContent = liffSteps.join('\n');
}
function showLiffError(detail){
  document.getElementById('liff-loading').hidden = true;
  document.getElementById('liff-error').hidden = false;
  document.getElementById('liff-error-detail').textContent = detail + '\n\n' + liffSteps.join('\n');
}
step('page loaded: ' + location.href);
let liffWatchdog = setTimeout(function(){
  showLiffError('初期化がタイムアウトしました（10秒）');
}, 10000);
function initLiff(){
  try{
    if(typeof liff === 'undefined'){
      clearTimeout(liffWatchdog);
      showLiffError('liff is undefined（SDK読み込み失敗）');
      return;
    }
    step('liff SDK OK, isInClient=' + liff.isInClient());
    liff.init({ liffId: '2011455921-pRkUNsnW' })
      .then(function(){
        step('init() resolved');
        const loggedIn = liff.isLoggedIn();
        step('isLoggedIn=' + loggedIn);
        if(!loggedIn){ step('calling liff.login()'); liff.login(); return; }
        step('calling getProfile()');
        return liff.getProfile();
      })
      .then(function(profile){
        if(!profile){ step('profile is empty(post-login redirect expected)'); return; }
        step('getProfile OK: ' + profile.displayName);
        clearTimeout(liffWatchdog);
        try{ sessionStorage.removeItem('liffRetried'); }catch(e){}
        lineProfile = profile;
        document.getElementById('liff-name').textContent = profile.displayName;
        document.getElementById('liff-avatar').src = profile.pictureUrl || '';
        document.getElementById('liff-loading').hidden = true;
        showOrderScreen('step1');
      })
      .catch(function(err){
        const msg = (err && err.message) ? err.message : String(err);
        if(msg.indexOf('access token expired')>=0 && !sessionStorage.getItem('liffRetried')){
          sessionStorage.setItem('liffRetried','1');
          try{ liff.logout(); }catch(e){}
          location.reload();
          return;
        }
        clearTimeout(liffWatchdog);
        showLiffError('init/getProfileエラー: ' + msg + (err && err.code ? (' / code: ' + err.code) : ''));
      });
  }catch(err){
    clearTimeout(liffWatchdog);
    showLiffError('同期エラー: ' + ((err && err.message) ? err.message : String(err)));
  }
}
initLiff();
</script>
